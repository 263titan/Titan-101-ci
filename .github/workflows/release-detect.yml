# Release tag poller (public)
#
# Replaces the private repo's `push: tags v*` release triggers (which burned
# private minutes). Polls the private Titan-101 repo for a NEW `v*` tag and
# invokes release.yml (build/sign/publish installers + Docker + npm + desktop
# + mobile) on FREE PUBLIC minutes.
#
# Deduplication: a tag is considered "handled" when a `ci/titan101-release-tag/<tag>`
# commit status exists on the tag's commit (pending/success/failure all count,
# so re-running a failed release requires the manual Release workflow) or when
# a GitHub Release already exists for that tag on the private repo.

name: Release Tag Poller

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-tag-poller
  cancel-in-progress: false

jobs:
  detect:
    name: Detect new Titan-101 release tag
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.pick.outputs.should-run }}
      repo: ${{ steps.pick.outputs.repo }}
      sha: ${{ steps.pick.outputs.sha }}
      branch: ${{ steps.pick.outputs.branch }}
      version-tag: ${{ steps.pick.outputs.version-tag }}
    steps:
      - name: Read newest Titan-101 release tag
        id: pick
        env:
          GH_TOKEN: ${{ secrets.REPO_ACCESS }}
        run: |
          set -euo pipefail
          REPO="263titan/Titan-101"
          SHA=""
          VERSION_TAG=""
          SHOULD_RUN="false"

          is_sha() { [[ "$1" =~ ^[0-9a-f]{40}$ ]]; }

          ghq() {
            local out
            out=$(gh api "$@" 2>/dev/null) || return 1
            printf '%s' "$out"
          }

          has_release_status() {
            local s="$1" tag="$2"
            local contexts
            contexts=$(ghq "repos/${REPO}/commits/${s}/status" --jq '.statuses[]?.context // empty') || return 1
            if [ -n "$contexts" ]; then
              if echo "$contexts" | grep -q "^ci/titan101-release-tag/${tag}$"; then
                return 0
              fi
            fi
            return 1
          }

          release_exists() {
            local tag="$1"
            if ghq "repos/${REPO}/releases/tags/${tag}" --jq '.tag_name // empty' >/dev/null; then
              return 0
            fi
            return 1
          }

          # Newest v* tag (matching-refs returns refs in lexicographic order)
          TAG=$(ghq "repos/${REPO}/git/matching-refs/tags/v" \
            --jq '[.[].ref | sub("refs/tags/";"")] | reverse | .[0] // empty') || TAG=""
          if [ -n "$TAG" ]; then
            TAG_OBJ=$(ghq "repos/${REPO}/git/ref/tags/${TAG}" --jq '.object.sha // empty') || TAG_OBJ=""
            if is_sha "$TAG_OBJ"; then
              resolve_commit() {
                local inner
                inner=$(ghq "repos/${REPO}/git/tags/${TAG_OBJ}" --jq '.object.sha // empty') || inner=""
                if is_sha "$inner"; then printf '%s' "$inner"; else printf '%s' "$TAG_OBJ"; fi
              }
              SHA=$(resolve_commit)
            fi
            if [ -n "$SHA" ] && ! has_release_status "$SHA" "$TAG" && ! release_exists "$TAG"; then
              VERSION_TAG="$TAG"
              SHOULD_RUN="true"
              ghq "repos/${REPO}/statuses/${SHA}" \
                -f state='pending' \
                -f context="ci/titan101-release-tag/${TAG}" \
                -f description="Release ${TAG} queued" >/dev/null || true
            fi
          fi

          echo "should-run=$SHOULD_RUN"
          echo "repo=$REPO"
          echo "sha=$SHA"
          echo "branch=main"
          echo "version-tag=$VERSION_TAG"
          echo "should-run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "branch=main" >> "$GITHUB_OUTPUT"
          echo "version-tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"

      - name: Render poll status (no new release tag)
        if: steps.pick.outputs.should-run == 'false'
        run: echo "No new Titan-101 release tag; skipping release this cycle."

  run-release:
    name: Titan-101 Release Pipeline
    needs: detect
    if: needs.detect.outputs.should-run == 'true'
    uses: ./.github/workflows/release.yml
    with:
      private-sha: ${{ needs.detect.outputs.sha }}
      private-branch: ${{ needs.detect.outputs.branch }}
      version-tag: ${{ needs.detect.outputs.version-tag }}
    secrets: inherit