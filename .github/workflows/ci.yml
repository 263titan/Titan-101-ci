# Titan-101 CI Runner (public)
#
# This repository is a CI/CD runner only — it contains NO application source.
# The private Titan-101 repo sends a `repository_dispatch` (event type `run-ci`)
# on every push; this workflow checks out the private code directly into the
# runner's workspace (NEVER stored or committed), runs the full CI pipeline on
# free public minutes, and reports a commit status back to the private repo.
#
# Required secret on THIS repo: REPO_ACCESS
#   Fine-grained PAT with Read access to the private Titan-101 repo contents
#   and Read+Write commit statuses (or classic PAT scoped to `repo`).

name: CI

on:
  repository_dispatch:
    types: [run-ci]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.client_payload.sha }}
  cancel-in-progress: true

env:
  PRIVATE_REPO: ${{ github.event.client_payload.repo }}
  PRIVATE_SHA: ${{ github.event.client_payload.sha }}
  PRIVATE_BRANCH: ${{ github.event.client_payload.branch }}
  PRIVATE_BEFORE: ${{ github.event.client_payload.before }}

jobs:
  # ── Setup ─────────────────────────────────────────────────────────────────
  setup:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.REPO_ACCESS }}
          fetch-depth: 0  # Full history needed for nx affected

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Render CI status (success)
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REPO_ACCESS }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: '263titan', repo: 'Titan-101',
              sha: process.env.PRIVATE_SHA,
              state: 'success', context: 'ci/titan101-setup',
              description: 'Install Dependencies',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
          env:
            PRIVATE_SHA: ${{ env.PRIVATE_SHA }}

      - name: Render CI status (failure)
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REPO_ACCESS }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: '263titan', repo: 'Titan-101',
              sha: process.env.PRIVATE_SHA,
              state: 'failure', context: 'ci/titan101-setup',
              description: 'Install Dependencies',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
          env:
            PRIVATE_SHA: ${{ env.PRIVATE_SHA }}

  # ── Detect Affected ───────────────────────────────────────────────────────
  affected:
    name: Detect Affected Projects
    runs-on: ubuntu-latest
    needs: setup
    outputs:
      ts-projects: ${{ steps.affected.outputs.ts }}
      rust-projects: ${{ steps.affected.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.REPO_ACCESS }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --no-frozen-lockfile

      - id: affected
        run: |
          BASE="${{ env.PRIVATE_BEFORE }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE="origin/main"; fi
          echo "base=$BASE"
          AFFECTED=$(pnpm nx show projects --affected --base="$BASE")
          # titanrippen needs MSVC; titan-mobile-sync needs EAS cloud (see mobile-release.yml).
          TS_PROJS=$(echo "$AFFECTED" | grep -v -E '(titangeometry|titanboolean|titanoffset|truepath-engine|plotvision-engine|titancolor|titanrippen|titan-mobile-sync)' | tr '\n' ',' | sed 's/,$//' || true)
          RUST_PROJS=$(echo "$AFFECTED" | grep -E '(titangeometry|titanboolean|titanoffset|truepath-engine|plotvision-engine|titancolor)' | tr '\n' ',' | sed 's/,$//' || true)
          echo "ts=$TS_PROJS" >> $GITHUB_OUTPUT
          echo "rust=$RUST_PROJS" >> $GITHUB_OUTPUT

      - name: Render CI status (success)
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REPO_ACCESS }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: '263titan', repo: 'Titan-101',
              sha: process.env.PRIVATE_SHA,
              state: 'success', context: 'ci/titan101-affected',
              description: 'Detect Affected Projects',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
          env:
            PRIVATE_SHA: ${{ env.PRIVATE_SHA }}

      - name: Render CI status (failure)
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REPO_ACCESS }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: '263titan', repo: 'Titan-101',
              sha: process.env.PRIVATE_SHA,
              state: 'failure', context: 'ci/titan101-affected',
              description: 'Detect Affected Projects',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
          env:
            PRIVATE_SHA: ${{ env.PRIVATE_SHA }}

  # ── TypeScript Build ──────────────────────────────────────────────────────
  build-ts:
    name: Build (TypeScript)
    runs-on: ubuntu-latest
    needs: affected
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.REPO_ACCESS }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --no-frozen-lockfile

      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-build-ts-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ env.PRIVATE_SHA }}
          restore-keys: |
            nx-${{ runner.os }}-build-ts-${{ hashFiles('**/pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-build-ts-
            nx-${{ runner.os }}-

      - name: Build TS projects
        run: |
          if [ -n "${{ needs.affected.outputs.ts-projects }}" ]; then
            pnpm nx run-many --target=build --projects=${{ needs.affected.outputs.ts-projects }} --parallel=4
          else
            echo "No TS projects affected"
          fi

      - name: Render CI status (success)
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REPO_ACCESS }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: '263titan', repo: 'Titan-101',
              sha: process.env.PRIVATE_SHA,
              state: 'success', context: 'ci/titan101-build-ts',
              description: 'Build (TypeScript)',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
          env:
            PRIVATE_SHA: ${{ env.PRIVATE_SHA }}

      - name: Render CI status (failure)
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REPO_ACCESS }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: '263titan', repo: 'Titan-101',
              sha: process.env.PRIVATE_SHA,
              state: 'failure', context: 'ci/titan101-build-ts',
              description: 'Build (TypeScript)',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
          env:
            PRIVATE_SHA: ${{ env.PRIVATE_SHA }}

  # ── Rust Engine Build ─────────────────────────────────────────────────────
  build-rust:
    name: Build (Rust Engines)
    runs-on: ubuntu-latest
    needs: affected
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.REPO_ACCESS }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0

      - uses: Swatinem/rust-cache@v2

      - name: Install protoc for tonic-build codegen
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - run: pnpm install --no-frozen-lockfile

      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-build-rust-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ env.PRIVATE_SHA }}
          restore-keys: |
            nx-${{ runner.os }}-build-rust-${{ hashFiles('**/pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-build-rust-
            nx-${{ runner.os }}-

      - name: Build Rust projects
        run: |
          if [ -n "${{ needs.affected.outputs.rust-projects }}" ]; then
            pnpm nx run-many --target=build --projects=${{ needs.affected.outputs.rust-projects }} --parallel=4
          else
            echo "No Rust projects affected"
          fi

      - name: Render CI status (success)
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REPO_ACCESS }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: '263titan', repo: 'Titan-101',
              sha: process.env.PRIVATE_SHA,
              state: 'success', context: 'ci/titan101-build-rust',
              description: 'Build (Rust Engines)',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
          env:
            PRIVATE_SHA: ${{ env.PRIVATE_SHA }}

      - name: Render CI status (failure)
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REPO_ACCESS }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: '263titan', repo: 'Titan-101',
              sha: process.env.PRIVATE_SHA,
              state: 'failure', context: 'ci/titan101-build-rust',
              description: 'Build (Rust Engines)',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
          env:
            PRIVATE_SHA: ${{ env.PRIVATE_SHA }}

  # ── Unit Tests ────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [build-ts, build-rust]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.REPO_ACCESS }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0

      - run: pnpm install --no-frozen-lockfile

      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-test-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ env.PRIVATE_SHA }}
          restore-keys: |
            nx-${{ runner.os }}-test-${{ hashFiles('**/pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-test-
            nx-${{ runner.os }}-

      - name: Run unit tests
        run: |
          BASE="${{ env.PRIVATE_BEFORE }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE="origin/main"; fi
          pnpm nx affected --target=test --base="$BASE" --parallel=4 --exclude=tests-hardware

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Render CI status (success)
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REPO_ACCESS }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: '263titan', repo: 'Titan-101',
              sha: process.env.PRIVATE_SHA,
              state: 'success', context: 'ci/titan101-test',
              description: 'Unit Tests',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
          env:
            PRIVATE_SHA: ${{ env.PRIVATE_SHA }}

      - name: Render CI status (failure)
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REPO_ACCESS }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: '263titan', repo: 'Titan-101',
              sha: process.env.PRIVATE_SHA,
              state: 'failure', context: 'ci/titan101-test',
              description: 'Unit Tests',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
          env:
            PRIVATE_SHA: ${{ env.PRIVATE_SHA }}

  # ── Lint & Type Check ─────────────────────────────────────────────────────
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.REPO_ACCESS }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - run: pnpm install --no-frozen-lockfile

      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-quality-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ env.PRIVATE_SHA }}
          restore-keys: |
            nx-${{ runner.os }}-quality-${{ hashFiles('**/pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-quality-
            nx-${{ runner.os }}-

      - name: Lint
        run: |
          BASE="${{ env.PRIVATE_BEFORE }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE="origin/main"; fi
          pnpm nx affected --target=lint --base="$BASE" --parallel=4 --max-warnings=0

      - name: Type check
        run: |
          BASE="${{ env.PRIVATE_BEFORE }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE="origin/main"; fi
          pnpm nx affected --target=typecheck --base="$BASE" --parallel=4

      - name: Rust format check
        run: cargo fmt --all -- --check

      - name: Install system dependencies for Rust crates
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Rust clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Render CI status (success)
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REPO_ACCESS }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: '263titan', repo: 'Titan-101',
              sha: process.env.PRIVATE_SHA,
              state: 'success', context: 'ci/titan101-quality',
              description: 'Lint & Type Check',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
          env:
            PRIVATE_SHA: ${{ env.PRIVATE_SHA }}

      - name: Render CI status (failure)
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REPO_ACCESS }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: '263titan', repo: 'Titan-101',
              sha: process.env.PRIVATE_SHA,
              state: 'failure', context: 'ci/titan101-quality',
              description: 'Lint & Type Check',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
          env:
            PRIVATE_SHA: ${{ env.PRIVATE_SHA }}