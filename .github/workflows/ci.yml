# Titan-101 CI (public) — entry point
#
# Legacy/manual entry point for the reusable CI pipeline (pipeline.yml).
# Kept for backward compatibility:
#   - `repository_dispatch` (event `run-ci`) — used previously by the private
#     repo's push-triggered workflow. Manual dispatch still works.
#   - `workflow_dispatch` — manual trigger with explicit inputs.
#
# The AUTOMATIC path is `.github/workflows/auto-ci.yml` (scheduled poller),
# which runs ALL CI entirely on PUBLIC minutes — no Titan-101 private minutes.
#
# Required secret on THIS repo: REPO_ACCESS, CODECOV_TOKEN (inherited).

name: CI

on:
  repository_dispatch:
    types: [run-ci]
  workflow_dispatch:
    inputs:
      private-repo:
        description: Private repo (owner/repo)
        required: false
        default: '263titan/Titan-101'
      private-sha:
        description: Commit SHA of the private repo to test
        required: true
      private-branch:
        description: Branch of the private repo
        required: false
        default: 'main'
      private-before:
        description: Base SHA (previous commit) for nx affected
        required: false
        default: ''

jobs:
  ci:
    name: Titan-101 CI Pipeline
    uses: ./.github/workflows/pipeline.yml
    with:
      private-repo: ${{ github.event.client_payload.repo || github.event.inputs.private-repo || '263titan/Titan-101' }}
      private-sha: ${{ github.event.client_payload.sha || github.event.inputs.private-sha }}
      private-branch: ${{ github.event.client_payload.branch || github.event.inputs.private-branch || 'main' }}
      private-before: ${{ github.event.client_payload.before || github.event.inputs.private-before || '' }}
    secrets: inherit