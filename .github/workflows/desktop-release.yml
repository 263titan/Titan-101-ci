# Desktop Production Release Pipeline (public runner)
#
# Builds napi-rs native addons per OS/arch, reassembles and packages/signs the
# Electron shells, creates the GitHub Release on the PRIVATE Titan-101 repo
# (so signed installers never appear on a public repo), and emits a checksum
# manifest. Triggered manually (workflow_dispatch) or by the release poller in
# auto-ci.yml when a new `v*.*.*` tag lands on the private repo.
#
# Required secrets on THIS repo: REPO_ACCESS, WIN_CSC_LINK,
# WIN_CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID,
# APPLE_CERTIFICATE_P12, APPLE_CERTIFICATE_PASSWORD (optional but needed for
# signing). NX_CLOUD_ACCESS_TOKEN optional (Nx Cloud is disabled).

name: Desktop Production Release Pipeline

on:
  workflow_dispatch:
    inputs:
      private-sha:
        description: 'Commit SHA of the private repo to release (default: main HEAD)'
        required: false
        default: ''
      private-branch:
        description: 'Branch of the private repo'
        required: false
        default: 'main'
      version-tag:
        description: 'Version tag for the release (vX.Y.Z)'
        required: true
        default: ''
  workflow_call:
    inputs:
      private-sha:
        type: string
        required: false
        default: 'main'
      private-branch:
        type: string
        required: false
        default: 'main'
      version-tag:
        type: string
        required: true
    secrets: inherit

concurrency:
  group: desktop-release-${{ inputs.version-tag || github.sha }}
  cancel-in-progress: false

env:
  PRIVATE_SHA: ${{ inputs.private-sha || 'main' }}
  PRIVATE_BRANCH: ${{ inputs.private-branch }}
  VERSION_TAG: ${{ inputs.version-tag }}

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1: Cross-compile napi-rs Rust engines on each native OS/arch
  # ────────────────────────────────────────────────────────────────────────────
  build-native-addons:
    name: Build Native Rust Addons (${{ matrix.artifact_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: win32-x64
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: darwin-x64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: darwin-arm64

    runs-on: ${{ matrix.os }}

    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

    steps:
      - name: Checkout private repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 263titan/Titan-101
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.REPO_ACCESS }}
          submodules: recursive
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: ${{ matrix.target }}

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build napi-rs Native Engines
        run: |
          pnpm exec nx run-many \
            --target=build:native \
            --projects=motion-hal,plotvision-engine,simulation-core,ai-engine,nest-engine,telemetry-engine \
            --extra-args="--target ${{ matrix.target }}" \
            --parallel=4

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build & smoke-test titanrippen C++ engine (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B engines/titanrippen/build -S engines/titanrippen -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build engines/titanrippen/build --config Release
          ctest --test-dir engines/titanrippen/build --output-on-failure

      - name: Verify native addon checksums
        run: node scripts/verify-native-checksums.js ${{ matrix.artifact_name }}

      - name: Upload Native Binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-bindings-${{ matrix.artifact_name }}
          retention-days: 7
          path: |
            engines/**/*.node
            crates/**/*.node

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2: Assemble all native addons and package Electron apps
  # ────────────────────────────────────────────────────────────────────────────
  package-electron:
    name: Package & Sign Desktop Electron Shells
    needs: build-native-addons
    runs-on: macos-14

    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

    steps:
      - name: Checkout private repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 263titan/Titan-101
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.REPO_ACCESS }}
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Download All Native Addon Artifacts
        uses: actions/download-artifact@eac690c756ca2ae2f82fde217f05f482e3a30bae # v4
        with:
          path: artifacts/native
          pattern: native-bindings-*
          merge-multiple: false

      - name: Reconstruct Native Addon Structure
        run: npx tsx scripts/assemble-native-addons.ts

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Import Apple Developer Certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/titan-signing.keychain-db"
          KEYCHAIN_PASS=$(openssl rand -hex 20)
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

      - name: Build & Package titan-printsync
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.REPO_ACCESS }}
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
        run: pnpm exec nx run titan-printsync:package

      - name: Build & Package titan-plotsync
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.REPO_ACCESS }}
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
        run: pnpm exec nx run titan-plotsync:package

      - name: Create GitHub Release on private repo
        uses: softprops/action-gh-release@v2
        with:
          repository: 263titan/Titan-101
          tag: ${{ env.VERSION_TAG }}
          target_commitish: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.REPO_ACCESS }}
          generate_release_notes: true
          files: |
            dist/apps/titan-printsync/*.dmg
            dist/apps/titan-printsync/*.exe
            dist/apps/titan-printsync/*.msi
            dist/apps/titan-printsync/*.zip
            dist/apps/titan-plotsync/*.dmg
            dist/apps/titan-plotsync/*.exe
            dist/apps/titan-plotsync/*.msi
            dist/apps/titan-plotsync/*.zip

      - name: Render release status (success)
        if: success()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.REPO_ACCESS }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: '263titan', repo: 'Titan-101',
              sha: process.env.PRIVATE_SHA,
              state: 'success', context: 'ci/titan101-release-desktop',
              description: `Desktop release ${process.env.VERSION_TAG}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
        env:
          PRIVATE_SHA: ${{ env.PRIVATE_SHA }}
          VERSION_TAG: ${{ env.VERSION_TAG }}

      - name: Render release status (failure)
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.REPO_ACCESS }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: '263titan', repo: 'Titan-101',
              sha: process.env.PRIVATE_SHA,
              state: 'failure', context: 'ci/titan101-release-desktop',
              description: `Desktop release ${process.env.VERSION_TAG} failed`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
        env:
          PRIVATE_SHA: ${{ env.PRIVATE_SHA }}
          VERSION_TAG: ${{ env.VERSION_TAG }}

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3: Post-release integrity report
  # ────────────────────────────────────────────────────────────────────────────
  release-integrity-report:
    name: Release Integrity & Sign-Off Report
    needs: package-electron
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout private repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 263titan/Titan-101
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.REPO_ACCESS }}
          submodules: recursive

      - name: Download All Release Artifacts
        uses: actions/download-artifact@eac690c756ca2ae2f82fde217f05f482e3a30bae # v4
        with:
          path: release-artifacts

      - name: Generate SHA-256 Checksum Manifest
        run: |
          find release-artifacts -type f | sort | xargs sha256sum > CHECKSUMS.txt
          cat CHECKSUMS.txt

      - name: Upload Checksum Manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-checksums
          path: CHECKSUMS.txt