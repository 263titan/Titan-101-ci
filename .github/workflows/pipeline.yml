# Titan-101 CI Pipeline (public)
#
# Reusable CI pipeline for the private 263titan/Titan-101 repository.
# This repository is a CI/CD runner only — it contains NO application source.
# The pipeline is invoked as a reusable workflow (`workflow_call`) with the
# private commit SHA as an input; it checks out the private code directly into
# the runner workspace (NEVER stored or committed), runs the full CI pipeline
# (unit tests, lint/typecheck, Ruby/TS builds, Rust engines, performance gates)
# on free PUBLIC minutes, and reports commit statuses back to the private repo.
#
# Invoked by:
#   - `.github/workflows/auto-ci.yml`  → scheduled poller (automatic, no private minutes)
#   - `.github/workflows/ci.yml`       → manual `workflow_dispatch` or legacy `repository_dispatch`
#
# Required secrets on THIS repo: REPO_ACCESS, CODECOV_TOKEN
#   REPO_ACCESS = Fine-grained PAT with Read access to the private Titan-101 repo
#   contents and Read+Write commit statuses (or classic PAT scoped to `repo`).

name: Titan-101 CI Pipeline

on:
  workflow_call:
    inputs:
      private-repo:
        type: string
        required: false
        default: '263titan/Titan-101'
      private-sha:
        type: string
        required: true
      private-branch:
        type: string
        required: false
        default: 'main'
      private-before:
        type: string
        required: false
        default: ''
    secrets:
      REPO_ACCESS:
        required: true
      CODECOV_TOKEN:
        required: false

concurrency:
  group: ci-${{ inputs.private-sha }}
  cancel-in-progress: true

env:
  PRIVATE_REPO: ${{ inputs.private-repo }}
  PRIVATE_SHA: ${{ inputs.private-sha }}
  PRIVATE_BRANCH: ${{ inputs.private-branch }}
  PRIVATE_BEFORE: ${{ inputs.private-before }}

jobs:
  # ── Setup ─────────────────────────────────────────────────────────────────
  setup:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.REPO_ACCESS }}
          fetch-depth: 0
          submodules: 'recursive'  # populate titan-docs-portal / titan-plugins at pinned gitlinks

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Render CI status (success)
        if: success()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.REPO_ACCESS }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: '263titan', repo: 'Titan-101',
              sha: process.env.PRIVATE_SHA,
              state: 'success', context: 'ci/titan101-setup',
              description: 'Install Dependencies',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
        env:
          PRIVATE_SHA: ${{ env.PRIVATE_SHA }}

      - name: Render CI status (failure)
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.REPO_ACCESS }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: '263titan', repo: 'Titan-101',
              sha: process.env.PRIVATE_SHA,
              state: 'failure', context: 'ci/titan101-setup',
              description: 'Install Dependencies',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
        env:
          PRIVATE_SHA: ${{ env.PRIVATE_SHA }}

  # ── Detect Affected ───────────────────────────────────────────────────────
  affected:
    name: Detect Affected Projects
    runs-on: ubuntu-latest
    needs: setup
    outputs:
      ts-projects: ${{ steps.affected.outputs.ts }}
      rust-projects: ${{ steps.affected.outputs.rust }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.REPO_ACCESS }}
          fetch-depth: 0
          submodules: 'recursive'  # populate titan-docs-portal / titan-plugins at pinned gitlinks

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - id: affected
        run: |
          BASE="${{ env.PRIVATE_BEFORE }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE="origin/main"; fi
          echo "base=$BASE"
          AFFECTED=$(pnpm nx show projects --affected --base="$BASE")
          # titanrippen needs MSVC; titan-mobile-sync needs EAS cloud (see mobile-release.yml).
          TS_PROJS=$(echo "$AFFECTED" | grep -v -E '(titangeometry|titanboolean|titanoffset|truepath-engine|plotvision-engine|titancolor|titanrippen|titan-mobile-sync)' | tr '\n' ',' | sed 's/,$//' || true)
          RUST_PROJS=$(echo "$AFFECTED" | grep -E '(titangeometry|titanboolean|titanoffset|truepath-engine|plotvision-engine|titancolor)' | tr '\n' ',' | sed 's/,$//' || true)
          echo "ts=$TS_PROJS" >> $GITHUB_OUTPUT
          echo "rust=$RUST_PROJS" >> $GITHUB_OUTPUT

      - name: Render CI status (success)
        if: success()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.REPO_ACCESS }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: '263titan', repo: 'Titan-101',
              sha: process.env.PRIVATE_SHA,
              state: 'success', context: 'ci/titan101-affected',
              description: 'Detect Affected Projects',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
        env:
          PRIVATE_SHA: ${{ env.PRIVATE_SHA }}

      - name: Render CI status (failure)
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.REPO_ACCESS }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: '263titan', repo: 'Titan-101',
              sha: process.env.PRIVATE_SHA,
              state: 'failure', context: 'ci/titan101-affected',
              description: 'Detect Affected Projects',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
        env:
          PRIVATE_SHA: ${{ env.PRIVATE_SHA }}

  # ── TypeScript Build ──────────────────────────────────────────────────────
  build-ts:
    name: Build (TypeScript)
    runs-on: ubuntu-latest
    needs: affected
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.REPO_ACCESS }}
          fetch-depth: 0
          submodules: 'recursive'  # populate titan-docs-portal / titan-plugins at pinned gitlinks

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Cache Nx
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-build-ts-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ env.PRIVATE_SHA }}
          restore-keys: |
            nx-${{ runner.os }}-build-ts-${{ hashFiles('**/pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-build-ts-
            nx-${{ runner.os }}-

      - name: Build TS projects
        run: |
          if [ -n "${{ needs.affected.outputs.ts-projects }}" ]; then
            pnpm nx run-many --target=build --projects=${{ needs.affected.outputs.ts-projects }} --parallel=4
          else
            echo "No TS projects affected"
          fi

      - name: Render CI status (success)
        if: success()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.REPO_ACCESS }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: '263titan', repo: 'Titan-101',
              sha: process.env.PRIVATE_SHA,
              state: 'success', context: 'ci/titan101-build-ts',
              description: 'Build (TypeScript)',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
        env:
          PRIVATE_SHA: ${{ env.PRIVATE_SHA }}

      - name: Render CI status (failure)
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.REPO_ACCESS }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: '263titan', repo: 'Titan-101',
              sha: process.env.PRIVATE_SHA,
              state: 'failure', context: 'ci/titan101-build-ts',
              description: 'Build (TypeScript)',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
        env:
          PRIVATE_SHA: ${{ env.PRIVATE_SHA }}

  # ── Rust Engine Build ─────────────────────────────────────────────────────
  build-rust:
    name: Build (Rust Engines)
    runs-on: ubuntu-latest
    needs: affected
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.REPO_ACCESS }}
          fetch-depth: 0
          submodules: 'recursive'  # populate titan-docs-portal / titan-plugins at pinned gitlinks

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: 1.97.0

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Install protoc for tonic-build codegen
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - run: pnpm install --frozen-lockfile

      - name: Cache Nx
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-build-rust-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ env.PRIVATE_SHA }}
          restore-keys: |
            nx-${{ runner.os }}-build-rust-${{ hashFiles('**/pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-build-rust-
            nx-${{ runner.os }}-

      - name: Build Rust projects
        run: |
          if [ -n "${{ needs.affected.outputs.rust-projects }}" ]; then
            pnpm nx run-many --target=build --projects=${{ needs.affected.outputs.rust-projects }} --parallel=4
          else
            echo "No Rust projects affected"
          fi

      - name: Render CI status (success)
        if: success()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.REPO_ACCESS }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: '263titan', repo: 'Titan-101',
              sha: process.env.PRIVATE_SHA,
              state: 'success', context: 'ci/titan101-build-rust',
              description: 'Build (Rust Engines)',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
        env:
          PRIVATE_SHA: ${{ env.PRIVATE_SHA }}

      - name: Render CI status (failure)
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.REPO_ACCESS }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: '263titan', repo: 'Titan-101',
              sha: process.env.PRIVATE_SHA,
              state: 'failure', context: 'ci/titan101-build-rust',
              description: 'Build (Rust Engines)',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
        env:
          PRIVATE_SHA: ${{ env.PRIVATE_SHA }}

  # ── Unit Tests ────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [build-ts, build-rust]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.REPO_ACCESS }}
          fetch-depth: 0
          submodules: 'recursive'  # populate titan-docs-portal / titan-plugins at pinned gitlinks

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: 1.97.0

      - run: pnpm install --frozen-lockfile

      - name: Cache Nx
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-test-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ env.PRIVATE_SHA }}
          restore-keys: |
            nx-${{ runner.os }}-test-${{ hashFiles('**/pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-test-
            nx-${{ runner.os }}-

      - name: Run unit tests
        run: |
          BASE="${{ env.PRIVATE_BEFORE }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE="origin/main"; fi
          pnpm nx affected --target=test --base="$BASE" --parallel=4 --exclude=tests-hardware

      - name: Upload coverage
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Render CI status (success)
        if: success()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.REPO_ACCESS }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: '263titan', repo: 'Titan-101',
              sha: process.env.PRIVATE_SHA,
              state: 'success', context: 'ci/titan101-test',
              description: 'Unit Tests',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
        env:
          PRIVATE_SHA: ${{ env.PRIVATE_SHA }}

      - name: Render CI status (failure)
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.REPO_ACCESS }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: '263titan', repo: 'Titan-101',
              sha: process.env.PRIVATE_SHA,
              state: 'failure', context: 'ci/titan101-test',
              description: 'Unit Tests',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
        env:
          PRIVATE_SHA: ${{ env.PRIVATE_SHA }}

  # ── Lint & Type Check ─────────────────────────────────────────────────────
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.REPO_ACCESS }}
          fetch-depth: 0
          submodules: 'recursive'  # populate titan-docs-portal / titan-plugins at pinned gitlinks

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - run: pnpm install --frozen-lockfile

      - name: Install system dependencies for Rust crates
        run: sudo apt-get update && sudo apt-get install -y libudev-dev unzip

      - name: Install protoc v5.29.3 (pinned to match committed generated output)
        run: |
          mkdir -p /tmp/protoc
          curl -sSL -o /tmp/protoc/protoc.zip \
            https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip
          unzip -q /tmp/protoc/protoc.zip -d /tmp/protoc
          sudo cp /tmp/protoc/bin/protoc /usr/local/bin/protoc
          protoc --version

      - name: Lint commit messages (Conventional Commits)
        run: |
          if [ -n "$PRIVATE_BEFORE" ] && [ "$PRIVATE_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            pnpm exec commitlint --from="$PRIVATE_BEFORE" --to="$PRIVATE_SHA"
          else
            pnpm exec commitlint --last
          fi
        env:
          PRIVATE_SHA: ${{ env.PRIVATE_SHA }}
          PRIVATE_BEFORE: ${{ env.PRIVATE_BEFORE }}

      - name: Cache Nx
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-quality-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ env.PRIVATE_SHA }}
          restore-keys: |
            nx-${{ runner.os }}-quality-${{ hashFiles('**/pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-quality-
            nx-${{ runner.os }}-

      - name: Lint
        run: |
          BASE="${{ env.PRIVATE_BEFORE }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE="origin/main"; fi
          pnpm nx affected --target=lint --base="$BASE" --parallel=4 --max-warnings=0

      - name: Type check
        run: |
          BASE="${{ env.PRIVATE_BEFORE }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE="origin/main"; fi
          pnpm nx affected --target=typecheck --base="$BASE" --parallel=4

      - name: Verify generated gRPC code is in sync
        run: |
          pnpm run codegen:proto
          git diff --exit-code -- proto libs/networking/src/grpc/generated

      - name: Rust format check
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Render CI status (success)
        if: success()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.REPO_ACCESS }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: '263titan', repo: 'Titan-101',
              sha: process.env.PRIVATE_SHA,
              state: 'success', context: 'ci/titan101-quality',
              description: 'Lint & Type Check',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
        env:
          PRIVATE_SHA: ${{ env.PRIVATE_SHA }}

      - name: Render CI status (failure)
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.REPO_ACCESS }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: '263titan', repo: 'Titan-101',
              sha: process.env.PRIVATE_SHA,
              state: 'failure', context: 'ci/titan101-quality',
              description: 'Lint & Type Check',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
        env:
          PRIVATE_SHA: ${{ env.PRIVATE_SHA }}

  # ── Performance Gates ─────────────────────────────────────────────────────
  benchmark:
    name: Rust Engine Performance Benchmark
    runs-on: ubuntu-latest
    needs: [build-rust, quality]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.REPO_ACCESS }}
          fetch-depth: 0
          submodules: 'recursive'  # populate titan-docs-portal / titan-plugins at pinned gitlinks

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: 1.97.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Run benchmark suite
        id: benchmark
        if: hashFiles('apps/titan-plotsync/scripts/run-benchmarks.js') != ''
        run: pnpm run benchmark:all

      - name: Benchmark suite not implemented
        if: hashFiles('apps/titan-plotsync/scripts/run-benchmarks.js') == ''
        run: echo "Benchmark producer script not implemented yet; skipping benchmark gate."

      - name: Parse benchmark results
        id: parse
        if: hashFiles('apps/titan-plotsync/scripts/run-benchmarks.js') != ''
        run: |
          if [ -f "scripts/parse-benchmarks.js" ]; then
            node scripts/parse-benchmarks.js > benchmark-results.json
          else
            echo "Benchmark parsing script not found"
            exit 1
          fi

      - name: Upload benchmark results
        if: hashFiles('benchmark-results.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-results-${{ env.PRIVATE_SHA }}
          path: benchmark-results.json

      - name: Performance regression check
        id: regression
        if: hashFiles('apps/titan-plotsync/scripts/run-benchmarks.js') != '' && hashFiles('scripts/check-performance-regression.js') != ''
        run: node scripts/check-performance-regression.js

      - name: Block on regression
        if: steps.regression.outputs.has_regression == 'true'
        run: |
          echo "Performance regression detected. Build blocked."
          exit 1

      - name: Render CI status (success)
        if: success()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.REPO_ACCESS }}
          script: |
            const skipped = '${{ steps.benchmark.outcome }}' === 'skipped';
            await github.rest.repos.createCommitStatus({
              owner: '263titan', repo: 'Titan-101',
              sha: process.env.PRIVATE_SHA,
              state: 'success', context: 'ci/titan101-benchmark',
              description: skipped ? 'Performance Benchmark (skipped: script not implemented)' : 'Performance Benchmark',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
        env:
          PRIVATE_SHA: ${{ env.PRIVATE_SHA }}

      - name: Render CI status (failure)
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.REPO_ACCESS }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: '263titan', repo: 'Titan-101',
              sha: process.env.PRIVATE_SHA,
              state: 'failure', context: 'ci/titan101-benchmark',
              description: 'Performance Benchmark',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
        env:
          PRIVATE_SHA: ${{ env.PRIVATE_SHA }}

  memory-safety:
    name: Memory Safety & Leak Detection
    runs-on: ubuntu-latest
    needs: [build-rust, quality]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.REPO_ACCESS }}
          fetch-depth: 0
          submodules: 'recursive'  # populate titan-docs-portal / titan-plugins at pinned gitlinks

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: 1.97.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Run memory leak detection
        id: memory
        if: hashFiles('apps/titan-plotsync/scripts/memory-leak-test.js') != ''
        run: pnpm run memory:test

      - name: Memory test not implemented
        if: hashFiles('apps/titan-plotsync/scripts/memory-leak-test.js') == ''
        run: echo "Memory producer script not implemented yet; skipping memory-safety gate."

      - name: Check buffer pool statistics
        if: hashFiles('apps/titan-plotsync/scripts/memory-leak-test.js') != '' && hashFiles('scripts/check-memory-stats.js') != ''
        run: node scripts/check-memory-stats.js

      - name: Upload memory profile
        if: always() && hashFiles('memory-profile.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: memory-profile-${{ env.PRIVATE_SHA }}
          path: memory-profile.json

      - name: Render CI status (success)
        if: success()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.REPO_ACCESS }}
          script: |
            const skipped = '${{ steps.memory.outcome }}' === 'skipped';
            await github.rest.repos.createCommitStatus({
              owner: '263titan', repo: 'Titan-101',
              sha: process.env.PRIVATE_SHA,
              state: 'success', context: 'ci/titan101-memory',
              description: skipped ? 'Memory Safety (skipped: script not implemented)' : 'Memory Safety',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
        env:
          PRIVATE_SHA: ${{ env.PRIVATE_SHA }}

      - name: Render CI status (failure)
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.REPO_ACCESS }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: '263titan', repo: 'Titan-101',
              sha: process.env.PRIVATE_SHA,
              state: 'failure', context: 'ci/titan101-memory',
              description: 'Memory Safety',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
        env:
          PRIVATE_SHA: ${{ env.PRIVATE_SHA }}

  protocol-validation:
    name: Hardware Protocol Validation
    runs-on: ubuntu-latest
    needs: [build-rust, quality]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.REPO_ACCESS }}
          fetch-depth: 0
          submodules: 'recursive'  # populate titan-docs-portal / titan-plugins at pinned gitlinks

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: 1.97.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Validate protocols
        id: protocol
        if: hashFiles('apps/titan-plotsync/scripts/validate-hpgl2.js') != ''
        run: pnpm run protocol:validate

      - name: Protocol validation not implemented
        if: hashFiles('apps/titan-plotsync/scripts/validate-hpgl2.js') == ''
        run: echo "Protocol producer scripts not implemented yet; skipping protocol-validation gate."

      - name: Protocol compliance report
        if: hashFiles('apps/titan-plotsync/scripts/validate-hpgl2.js') != '' && hashFiles('scripts/protocol-compliance-report.js') != ''
        run: node scripts/protocol-compliance-report.js

      - name: Upload protocol validation results
        if: always() && hashFiles('protocol-results.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: protocol-validation-${{ env.PRIVATE_SHA }}
          path: protocol-results.json

      - name: Render CI status (success)
        if: success()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.REPO_ACCESS }}
          script: |
            const skipped = '${{ steps.protocol.outcome }}' === 'skipped';
            await github.rest.repos.createCommitStatus({
              owner: '263titan', repo: 'Titan-101',
              sha: process.env.PRIVATE_SHA,
              state: 'success', context: 'ci/titan101-protocol',
              description: skipped ? 'Protocol Validation (skipped: scripts not implemented)' : 'Protocol Validation',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
        env:
          PRIVATE_SHA: ${{ env.PRIVATE_SHA }}

      - name: Render CI status (failure)
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.REPO_ACCESS }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: '263titan', repo: 'Titan-101',
              sha: process.env.PRIVATE_SHA,
              state: 'failure', context: 'ci/titan101-protocol',
              description: 'Protocol Validation',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
        env:
          PRIVATE_SHA: ${{ env.PRIVATE_SHA }}

  # ── Finalize (auto-ci poll marker) ────────────────────────────────────────
  finalize:
    name: Finalize (poll marker)
    runs-on: ubuntu-latest
    if: always()
    needs: [setup, affected, build-ts, build-rust, test, quality, benchmark, memory-safety, protocol-validation]
    steps:
      - name: Render poll marker (success)
        if: ${{ !cancelled() && needs.setup.result == 'success' && needs.affected.result == 'success' && needs.build-ts.result == 'success' && needs.build-rust.result == 'success' && needs.test.result == 'success' && needs.quality.result == 'success' && needs.benchmark.result == 'success' && needs.memory-safety.result == 'success' && needs.protocol-validation.result == 'success' }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.REPO_ACCESS }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: '263titan', repo: 'Titan-101',
              sha: process.env.PRIVATE_SHA,
              state: 'success', context: 'ci/titan101-poll',
              description: 'Auto CI complete',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
        env:
          PRIVATE_SHA: ${{ env.PRIVATE_SHA }}

      - name: Render poll marker (failure/cancelled)
        if: ${{ cancelled() || needs.setup.result != 'success' || needs.affected.result != 'success' || needs.build-ts.result != 'success' || needs.build-rust.result != 'success' || needs.test.result != 'success' || needs.quality.result != 'success' || needs.benchmark.result != 'success' || needs.memory-safety.result != 'success' || needs.protocol-validation.result != 'success' }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.REPO_ACCESS }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: '263titan', repo: 'Titan-101',
              sha: process.env.PRIVATE_SHA,
              state: 'failure', context: 'ci/titan101-poll',
              description: 'Auto CI failed or cancelled',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
        env:
          PRIVATE_SHA: ${{ env.PRIVATE_SHA }}