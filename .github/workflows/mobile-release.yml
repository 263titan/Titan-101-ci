# Mobile EAS Build & Submit (public runner)
#
# EAS builds for iOS (ARKit + WebRTC) and Android (ARCore + WebRTC) from the
# private Titan-101 checkout on FREE public minutes. Triggered manually
# (workflow_dispatch) or by the release poller in auto-ci.yml.
#
# Required secret on THIS repo: EXPO_TOKEN. (EAS CLI / build / submit run
# against the Expo account the token belongs to.)

name: Mobile EAS Build & Submit

on:
  workflow_dispatch:
    inputs:
      private-sha:
        description: 'Commit SHA of the private repo (default: main HEAD)'
        required: false
        default: ''
      private-branch:
        description: 'Branch of the private repo'
        required: false
        default: 'main'
      profile:
        description: 'EAS Build Profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - development
          - preview
          - production
      version-tag:
        description: 'Version tag for the release (vX.Y.Z)'
        required: false
        default: ''
  workflow_call:
    inputs:
      private-sha:
        type: string
        required: false
        default: 'main'
      private-branch:
        type: string
        required: false
        default: 'main'
      profile:
        type: string
        required: true
        default: 'production'
      version-tag:
        type: string
        required: true
    secrets: inherit

concurrency:
  group: mobile-release-${{ inputs.version-tag || github.sha }}
  cancel-in-progress: false

env:
  PRIVATE_SHA: ${{ inputs.private-sha || 'main' }}
  PRIVATE_BRANCH: ${{ inputs.private-branch }}
  EAS_PROFILE: ${{ inputs.profile || 'production' }}

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1: iOS ARKit Native Build via EAS
  # ────────────────────────────────────────────────────────────────────────────
  build-ios:
    name: EAS Build — iOS (ARKit + WebRTC)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout private repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 263titan/Titan-101
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.REPO_ACCESS }}
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install EAS CLI
        run: pnpm add -g eas-cli

      - name: Authenticate with Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas whoami

      - name: EAS Build — iOS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        working-directory: apps/titan-mobile-sync
        run: |
          eas build \
            --platform ios \
            --profile ${{ env.EAS_PROFILE }} \
            --non-interactive \
            --wait

      - name: Submit to TestFlight (production only)
        if: env.EAS_PROFILE == 'production'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        working-directory: apps/titan-mobile-sync
        run: |
          eas submit \
            --platform ios \
            --non-interactive \
            --latest

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2: Android ARCore Native Build via EAS
  # ────────────────────────────────────────────────────────────────────────────
  build-android:
    name: EAS Build — Android (ARCore + WebRTC)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout private repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 263titan/Titan-101
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.REPO_ACCESS }}
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install EAS CLI
        run: pnpm add -g eas-cli

      - name: Authenticate with Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas whoami

      - name: EAS Build — Android
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        working-directory: apps/titan-mobile-sync
        run: |
          eas build \
            --platform android \
            --profile ${{ env.EAS_PROFILE }} \
            --non-interactive \
            --wait

      - name: Submit to Play Store Internal Track (production only)
        if: env.EAS_PROFILE == 'production'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        working-directory: apps/titan-mobile-sync
        run: |
          eas submit \
            --platform android \
            --non-interactive \
            --latest

      - name: Render release status (success)
        if: success()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.REPO_ACCESS }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: '263titan', repo: 'Titan-101',
              sha: process.env.PRIVATE_SHA,
              state: 'success', context: 'ci/titan101-release-mobile',
              description: `Mobile EAS ${process.env.EAS_PROFILE}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
        env:
          PRIVATE_SHA: ${{ env.PRIVATE_SHA }}
          EAS_PROFILE: ${{ env.EAS_PROFILE }}

      - name: Render release status (failure)
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.REPO_ACCESS }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: '263titan', repo: 'Titan-101',
              sha: process.env.PRIVATE_SHA,
              state: 'failure', context: 'ci/titan101-release-mobile',
              description: `Mobile EAS ${process.env.EAS_PROFILE} failed`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
        env:
          PRIVATE_SHA: ${{ env.PRIVATE_SHA }}
          EAS_PROFILE: ${{ env.EAS_PROFILE }}