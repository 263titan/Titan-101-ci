# Hardware Lab Tests (public runner, manual dispatch)
#
# Runs the hardware-in-loop suite against the private Titan-101 checkout on
# FREE public minutes. Reports ci/titan101-hardware back to the private repo.
# The private-repo copy has been removed so the billing-blocked private
# GitHub-hosted runner can no longer turn hardware deployments red.
#
# The hardware-lab environment lives on THIS (public) repo; set the
# TITAN_LAB_HOST variable there to point at the lab, or the test step is
# skipped with a notice.

name: Hardware Lab Tests

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Specific device to test (leave empty for all)'
        required: false
        default: ''
      private-sha:
        description: 'Commit SHA of the private repo to test (default: main HEAD)'
        required: false
        default: ''
      private-branch:
        description: 'Branch of the private repo'
        required: false
        default: 'main'

permissions:
  contents: read

jobs:
  hardware-tests:
    name: Hardware-in-Loop Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: hardware-lab
    env:
      PRIVATE_SHA: ${{ inputs.private-sha || 'main' }}
      PRIVATE_BRANCH: ${{ inputs.private-branch }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 263titan/Titan-101
          ref: ${{ inputs.private-sha || 'main' }}
          token: ${{ secrets.REPO_ACCESS }}
          submodules: recursive
          fetch-depth: 0

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: 1.97.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Cache Nx
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-hardware-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ env.PRIVATE_SHA }}
          restore-keys: |
            nx-${{ runner.os }}-hardware-${{ hashFiles('**/pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-hardware-
            nx-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
        env:
          CI: 'true'

      - name: Install system dependencies for Rust crates
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Build DeviceSync + TruePath
        continue-on-error: true
        run: |
          pnpm nx build devicesync || echo "::warning::DeviceSync build failed (tsconfig rootDir issue with motion-hal)"
          pnpm nx build truepath || echo "::warning::TruePath build failed"
          cargo build --release -p truepath-engine

      - name: Run hardware tests
        if: vars.TITAN_LAB_HOST != ''
        env:
          TITAN_LAB: 'true'
          TITAN_LAB_HOST: ${{ vars.TITAN_LAB_HOST }}
          TITAN_DEVICE_FILTER: ${{ inputs.device }}
        run: |
          mkdir -p tests/hardware/results
          pnpm nx run tests-hardware:test 2>&1 | tee tests/hardware/results/output.log || {
            echo "::error::Hardware tests failed"
            exit 1
          }

      - name: Skip hardware tests (no lab host configured)
        if: vars.TITAN_LAB_HOST == ''
        run: |
          echo "::notice::No TITAN_LAB_HOST variable configured in the public hardware-lab environment — skipping hardware tests"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hardware-test-results
          path: tests/hardware/results/
          retention-days: 90
          if-no-files-found: ignore

      - name: Render CI status (success)
        if: success()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.REPO_ACCESS }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: '263titan', repo: 'Titan-101',
              sha: process.env.PRIVATE_SHA,
              state: 'success', context: 'ci/titan101-hardware',
              description: 'Hardware Lab Tests',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
        env:
          PRIVATE_SHA: ${{ env.PRIVATE_SHA }}

      - name: Render CI status (failure)
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.REPO_ACCESS }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: '263titan', repo: 'Titan-101',
              sha: process.env.PRIVATE_SHA,
              state: 'failure', context: 'ci/titan101-hardware',
              description: 'Hardware Lab Tests',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
        env:
          PRIVATE_SHA: ${{ env.PRIVATE_SHA }}