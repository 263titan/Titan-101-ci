# Storybook Preview (public runner, manual dispatch)
#
# Builds the UI component library Storybook from the private Titan-101
# checkout on FREE public minutes and previews it on THIS repo's GitHub Pages.
# The private-repo copy has been removed.

name: Storybook Preview

on:
  workflow_dispatch:
    inputs:
      private-sha:
        description: 'Commit SHA of the private repo to build (default: main HEAD)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write

env:
  PRIVATE_SHA: ${{ inputs.private-sha || 'main' }}

jobs:
  build-storybook:
    name: Build & Publish Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 263titan/Titan-101
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.REPO_ACCESS }}
          submodules: recursive

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Nx
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-storybook-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ env.PRIVATE_SHA }}
          restore-keys: |
            nx-${{ runner.os }}-storybook-${{ hashFiles('**/pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-storybook-
            nx-${{ runner.os }}-

      - name: Build Storybook
        run: pnpm nx build-storybook ui
        env:
          STORYBOOK_DISABLE_TELEMETRY: 1

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: libs/ui/storybook-static
          destination_dir: storybook-preview