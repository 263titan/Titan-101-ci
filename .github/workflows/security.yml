# Security scan (public)
#
# Daily scheduled dependency CVE audit + secret scanning for the private
# Titan-101 repo, executed entirely on PUBLIC minutes (no Titan-101 quota).
# Reports a `ci/titan101-security` commit status back to the private repo.
#
# Why not CodeQL here: code-scanning uploads are bound to the repo that runs
# the workflow; running it on this PUBLIC repo would publish private-code
# findings. SAST stays on the private repo's manual `security.yml`. This
# workflow covers supply-chain (CVE) + secret leakage instead.
#
# Required secret on THIS repo: REPO_ACCESS.

name: Security Scan

on:
  schedule:
    - cron: '23 8 * * *'        # daily 08:23 UTC
  workflow_dispatch:
    inputs:
      target-sha:
        description: 'Commit SHA to scan (default: Titan-101 main HEAD)'
        required: false
        type: string

permissions:
  contents: read

env:
  PRIVATE_REPO: '263titan/Titan-101'

jobs:
  security:
    name: Dependency & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target SHA
        id: resolve
        run: |
          SHA="${{ github.event.inputs.target-sha }}"
          if [ -z "$SHA" ]; then
            SHA=$(gh api "repos/$PRIVATE_REPO/commits/main" --jq .sha)
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Scanning $PRIVATE_REPO@$SHA"
        env:
          GH_TOKEN: ${{ secrets.REPO_ACCESS }}
          PRIVATE_REPO: ${{ env.PRIVATE_REPO }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: '263titan/Titan-101'
          ref: ${{ steps.resolve.outputs.sha }}
          token: ${{ secrets.REPO_ACCESS }}
          fetch-depth: 1
          submodules: 'recursive'

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: npm/pnpm CVE audit (high and critical)
        run: pnpm audit --audit-level high

      - name: Rust CVE audit
        uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # main
        with:
          token: ${{ secrets.REPO_ACCESS }}

      - name: Secret scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@f714bf454f350590f4a24c3ddb1aef02c35bf5b6 # main
        with:
          path: ./
          scan_type: filesystem
          fail: true

      - name: Render scan status (success)
        if: success()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.REPO_ACCESS }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: '263titan', repo: 'Titan-101',
              sha: process.env.PRIVATE_SHA,
              state: 'success', context: 'ci/titan101-security',
              description: 'Dependency & secret scan clean',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
        env:
          PRIVATE_SHA: ${{ steps.resolve.outputs.sha }}

      - name: Render scan status (failure)
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.REPO_ACCESS }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: '263titan', repo: 'Titan-101',
              sha: process.env.PRIVATE_SHA,
              state: 'failure', context: 'ci/titan101-security',
              description: 'Dependency & secret scan found issues',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
        env:
          PRIVATE_SHA: ${{ steps.resolve.outputs.sha }}